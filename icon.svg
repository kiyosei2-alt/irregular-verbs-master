<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners (maskable safe zone) -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <!-- Music note stem -->
  <rect x="278" y="110" width="26" height="210" rx="13" fill="#FFE66D"/>
  <!-- Music note head -->
  <ellipse cx="252" cy="336" rx="50" ry="36" fill="#FFE66D" transform="rotate(-18 252 336)"/>
  <!-- Music note flag -->
  <path d="M304 110 Q400 160 375 245" stroke="#FFE66D" stroke-width="26" fill="none" stroke-linecap="round"/>
  <!-- Stars -->
  <text x="110" y="180" font-size="64" fill="#FFC6FF" opacity=".8" font-family="serif">★</text>
  <text x="370" y="420" font-size="48" fill="#A8E6CF" opacity=".8" font-family="serif">★</text>
  <!-- ABC -->
  <text x="256" y="458" text-anchor="middle" font-size="82" fill="white"
        font-family="Arial Black, Arial, sans-serif" font-weight="900" opacity=".92">ABC</text>
</svg>
